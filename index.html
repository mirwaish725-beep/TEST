<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سیستم سفارشات چاپخانه</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="topbar">
            <h1>سیستم مدیریت چاپخانه</h1>
        </header>

        <main class="content">

            <div class="page-header">

                <div>
                    <h2>👥 مشتریان</h2>
                    <p>مدیریت مشتریان چاپخانه</p>
                </div>

                <button id="add-customer-btn">
                    + مشتری جدید
                </button>

            </div>

            <div class="search-box">

                <input
                    type="text"
                    id="customer-search"
                    placeholder="جستجوی نام یا شماره تماس..."
                >

            </div>
<!-- فرم ثبت مشتری -->
<div id="customer-form-container" class="form-container hidden">

    <div class="form-header">
        <h3>ثبت مشتری جدید</h3>

        <button
            type="button"
            id="close-customer-form"
            class="close-btn"
        >
            ×
        </button>
    </div>

    <form id="customer-form">

        <div class="form-grid">

            <div class="form-group">
                <label>شماره مشتری</label>

                <input
                    type="number"
                    id="customer-no"
                    required
                >
            </div>


            <div class="form-group">
                <label>نام مشتری</label>

                <input
                    type="text"
                    id="customer-name"
                    required
                >
            </div>


            <div class="form-group">
                <label>شماره تماس</label>

                <input
                    type="text"
                    id="customer-phone"
                >
            </div>


            <div class="form-group">
                <label>نوع مشتری</label>

                <select id="customer-type" required>

                    <option value="credit">
                        نسیه
                    </option>

                    <option value="cash">
                        نقدی
                    </option>

                </select>
            </div>


            <div class="form-group full-width">
                <label>آدرس</label>

                <input
                    type="text"
                    id="customer-address"
                >
            </div>


            <div class="form-group full-width">
                <label>توضیحات</label>

                <textarea
                    id="customer-description"
                    rows="3"
                ></textarea>
            </div>

        </div>


        <div class="form-actions">

            <button
                type="button"
                id="cancel-customer"
                class="cancel-btn"
            >
                لغو
            </button>

            <button
                type="submit"
                class="save-btn"
            >
                ثبت مشتری
            </button>

        </div>

    </form>

</div>
            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>شماره</th>
                            <th>نام مشتری</th>
                            <th>شماره تماس</th>
                            <th>نوع</th>
                            <th>عملیات</th>
                        </tr>

                    </thead>

                    <tbody id="customers-table-body">

                        <tr>
                            <td colspan="5">
                                در حال دریافت مشتریان...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>
